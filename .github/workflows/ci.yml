name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.11"; these are the released versions the lock installs on.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag; pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Format
        run: .venv/bin/ruff format --check .
      - name: Test with coverage
        env:
          DEMO_MODE: "true"
        # The floor is fail_under in [tool.coverage.report].
        run: .venv/bin/pytest --cov --cov-report=term
      - name: Dependency audit
        if: matrix.python-version == '3.11'
        run: make audit

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --frozen --extra dev --python 3.11
      - name: Pyright
        run: make typecheck

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t p2p-handler:ci .
      - name: Start and wait for the health check
        run: |
          docker run -d --name p2p -p 127.0.0.1:8501:8501 p2p-handler:ci
          for attempt in $(seq 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' p2p)
            echo "health: $status"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs p2p
          exit 1
      - name: Runs as a non-root user
        run: test "$(docker exec p2p id -u)" = 10001
