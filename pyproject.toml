[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-p2p-exception-handler"
version = "0.1.0"
description = "Auditable LangGraph workflow for Procure-to-Pay exception handling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.67,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
p2p-seed = "p2p.infrastructure.database:seed_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["p2p"]
# Spawned helper processes in the two-process test report their own coverage.
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured 97% when this was set; a drop of more than a point fails CI.
fail_under = 96

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
